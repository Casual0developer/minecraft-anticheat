// =====================================================================
// AntiCheat — Bukkit plugin
// Produces: build/libs/anticheat-bukkit-<version>.jar
// =====================================================================

plugins {
    id 'java'
}

group   = 'dev.anticheat'
version = providers.gradleProperty('mod_version').getOrElse('1.0.0')
description = 'AntiCheat Plugin for Bukkit 1.21.1'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

repositories {
    mavenCentral()
    maven {
        name = 'spigot-repo'
        url  = 'https://hub.spigotmc.org/nexus/content/repositories/snapshots/'
    }
    maven {
        name = 'sonatype'
        url  = 'https://oss.sonatype.org/content/groups/public/'
    }
}

dependencies {
    compileOnly 'org.spigotmc:spigot-api:1.21.1-R0.1-SNAPSHOT'
}

processResources {
    def props = [version: version]
    inputs.properties props
    filteringCharset 'UTF-8'
    filesMatching('plugin.yml') {
        expand props
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

jar {
    archiveBaseName = 'anticheat-bukkit'
    archiveVersion  = project.version
}
